
name: Docker User Registration FastAPI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: Run Python Tests
  build-and-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Tests
        run: |
          python -m pytest -v


  # JOB 2: Build Docker Image
  dockerbuild:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t user-management-api:latest .


  # JOB 3: Build and Publish to Docker Hub
  build-and-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - dockerbuild

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub Credentials
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DH_USER" ]; then
            echo "ERROR: DOCKER_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$DH_TOKEN" ]; then
            echo "ERROR: DOCKER_PASSWORD secret is missing"
            exit 1
          fi

          if [[ ! "$DH_TOKEN" =~ ^dckr_pat_ ]]; then
            echo "ERROR: Docker Hub access token format is incorrect"
            exit 1
          fi

          if [[ "$DH_USER" =~ [[:space:]] ]] || [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "ERROR: Credentials must not contain whitespace"
            exit 1
          fi

          echo "Docker Hub credentials validation successful"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-management-api:latest
            ${{ secrets.DOCKER_USERNAME }}/user-management-api:${{ github.sha }}

      - name: Image Digest
        run: |
          echo "Docker image published successfully"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/user-management-api:latest"
          echo "Commit: ${{ github.sha }}"
