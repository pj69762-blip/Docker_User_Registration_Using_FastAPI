name: CI/CD for FastAPI Docker Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test FastAPI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations
        run: alembic upgrade head

      - name: Run Pytest
        run: pytest -v

  dockerbuild:
    name: Build FastAPI Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

              - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker credentials format
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "Docker credentials are missing"
            exit 1
          fi
          if [[ "$DH_TOKEN" != dckr_pat_* ]]; then
            echo "Token does not appear to have the expected Docker Hub PAT prefix"
            exit 1
          fi
          if [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "Token contains whitespace"
            exit 1
          fi
          echo "Docker credential format checks passed"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fastapi-app:latest

  build-and-publish:
    name: Publish FastAPI Image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - dockerbuild

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

              - name: Validate Docker credentials format
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "Docker credentials are missing"
            exit 1
          fi
          if [[ "$DH_TOKEN" != dckr_pat_* ]]; then
            echo "Token does not appear to have the expected Docker Hub PAT prefix"
            exit 1
          fi
          if [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "Token contains whitespace"
            exit 1
          fi
          echo "Docker credential format checks passed"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-management-api:latest
            ${{ secrets.DOCKER_USERNAME }}/user-management-api:${{ github.sha }}

      - name: Display Image Digest
        run: |
          echo "Image digest: ${{ steps.docker-build.outputs.digest }}"
