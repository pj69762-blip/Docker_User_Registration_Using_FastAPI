
name: Docker User Registration FastAPI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: Run Python Tests
  build-and-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Tests
        run: |
          python -m pytest -v


  # JOB 2: Build Docker Image
  dockerbuild:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t user-management-api:latest .


  # JOB 3: Build and Publish to Docker Hub
  build-and-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - dockerbuild

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Diagnose Docker Hub Credentials
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e

          if [ -z "$DH_USER" ]; then
            echo "ERROR: Username is empty"
            exit 1
          fi

          if [ -z "$DH_TOKEN" ]; then
            echo "ERROR: Token is empty"
            exit 1
          fi

          if [[ "$DH_USER" =~ [[:space:]] ]]; then
            echo "ERROR: Username contains whitespace"
            exit 1
          fi

          if [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "ERROR: Token contains whitespace"
            exit 1
          fi

          if [[ ! "$DH_TOKEN" =~ ^dckr_pat_ ]]; then
            echo "ERROR: Invalid token format"
            exit 1
          fi

          echo "Both credentials passed validation"

          printf '%s' "$DH_TOKEN" | docker login \
            --username "$DH_USER" \
            --password-stdin

          echo "Docker Hub login successful"
      - name: Build and Push Docker Image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.docker-login.outputs.username }}/user-management-api:latest
            ${{ steps.docker-login.outputs.username }}/user-management-api:${{ github.sha }}

      - name: Image Digest
        run: |
          echo "Docker image published successfully"
          echo "Image digest: ${{ steps.docker-build.outputs.digest }}"
